<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grind Log</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg:#14180F;
    --panel:#1C2216;
    --line:#30382A;
    --text:#ECE8DC;
    --muted:#878E7C;
    --focus:#D9A23B;
    --life:#7C9070;
    --behind:#C75D4D;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    padding:20px 14px 60px;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:560px; margin:0 auto;}

  /* ---- Header ---- */
  header{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:18px;
  }
  .title{
    font-size:1.5rem; font-weight:700; letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .subtitle{
    font-family:'JetBrains Mono', monospace; font-size:0.75rem;
    color:var(--muted); margin-top:4px; letter-spacing:0.05em;
  }
  .clock{
    font-family:'JetBrains Mono', monospace; font-size:1.4rem; font-weight:700;
    text-align:right; line-height:1.1;
  }
  .clock-date{
    font-family:'JetBrains Mono', monospace; font-size:0.7rem;
    color:var(--muted); text-align:right; margin-top:2px; letter-spacing:0.08em;
  }

  /* ---- Status panel ---- */
  .status{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; margin-bottom:20px;
  }
  .status-row{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'JetBrains Mono', monospace; font-size:0.7rem;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--muted);
    margin-bottom:6px;
  }
  .bar{
    position:relative; height:8px; border-radius:5px; background:var(--bg);
    overflow:hidden; margin-bottom:10px;
  }
  .bar:last-of-type{margin-bottom:0;}
  .bar-fill{
    position:absolute; top:0; left:0; height:100%; border-radius:5px;
    transition:width 0.4s ease;
  }
  .bar-fill.actual{background:var(--focus);}
  .bar-fill.expected{background:transparent; border-right:2px solid var(--text); height:100%;}

  .status-footer{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:12px; padding-top:12px; border-top:1px solid var(--line);
  }
  .verdict{
    font-family:'JetBrains Mono', monospace; font-size:0.8rem; font-weight:700;
    letter-spacing:0.06em; text-transform:uppercase;
  }
  .verdict.ok{color:var(--life);}
  .verdict.behind{color:var(--behind);}
  .verdict.ahead{color:var(--focus);}
  .streak{
    font-family:'JetBrains Mono', monospace; font-size:0.75rem; color:var(--muted);
    text-align:right;
  }
  .streak b{color:var(--text); font-size:1rem;}

  /* ---- Timeline ---- */
  .timeline{display:flex; flex-direction:column; gap:6px;}

  .block{
    display:flex; align-items:center; gap:12px;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; border-left:4px solid var(--line);
    transition:border-color 0.2s, opacity 0.2s;
  }
  .block.now{border-left-color:var(--focus); background:#22281A;}
  .block.done{opacity:0.45;}
  .block.past:not(.done){border-left-color:var(--behind);}

  .check{
    flex:none; width:22px; height:22px; border-radius:6px;
    border:2px solid var(--muted); background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:0.85rem; color:var(--bg); font-weight:700;
  }
  .block.done .check{background:var(--life); border-color:var(--life);}

  .block-info{flex:1; min-width:0;}
  .block-time{
    font-family:'JetBrains Mono', monospace; font-size:0.68rem; color:var(--muted);
    letter-spacing:0.06em;
  }
  .block-label{
    font-size:0.9rem; font-weight:500; margin-top:1px;
  }

  .tag{
    flex:none; font-family:'JetBrains Mono', monospace; font-size:0.62rem;
    font-weight:700; letter-spacing:0.1em; padding:3px 7px; border-radius:4px;
    text-transform:uppercase;
  }
  .tag.focus{background:rgba(217,162,59,0.16); color:var(--focus);}
  .tag.life{background:rgba(124,144,112,0.16); color:var(--life);}

  .now-badge{
    flex:none; font-family:'JetBrains Mono', monospace; font-size:0.62rem;
    font-weight:700; letter-spacing:0.1em; color:var(--focus); padding-right:2px;
  }

  /* ---- Notes ---- */
  .notes{
    margin-top:22px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:14px 16px;
  }
  .notes label{
    display:block; font-family:'JetBrains Mono', monospace; font-size:0.7rem;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--muted);
    margin-bottom:8px;
  }
  textarea{
    width:100%; background:var(--bg); border:1px solid var(--line);
    border-radius:6px; color:var(--text); font-family:'Space Grotesk', sans-serif;
    font-size:0.85rem; padding:10px; resize:vertical; min-height:64px;
  }
  textarea:focus{outline:1px solid var(--focus);}

  .reset-row{
    display:flex; justify-content:flex-end; margin-top:20px;
  }
  .reset-btn{
    font-family:'JetBrains Mono', monospace; font-size:0.7rem; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--muted); background:transparent;
    border:1px solid var(--line); border-radius:6px; padding:8px 14px; cursor:pointer;
  }
  .reset-btn:hover{color:var(--behind); border-color:var(--behind);}

  @media (max-width:380px){
    .clock{font-size:1.15rem;}
    .title{font-size:1.25rem;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="title">Grind Log</div>
      <div class="subtitle" id="dateline">—</div>
    </div>
    <div>
      <div class="clock" id="clock">--:--</div>
      <div class="clock-date" id="clockSecs">--</div>
    </div>
  </header>

  <div class="status">
    <div class="status-row"><span>Actual progress</span><span id="actualPct">0%</span></div>
    <div class="bar"><div class="bar-fill actual" id="actualBar" style="width:0%"></div></div>
    <div class="status-row"><span>Expected by now</span><span id="expectedPct">0%</span></div>
    <div class="bar"><div class="bar-fill expected" id="expectedBar" style="left:0%"></div></div>

    <div class="status-footer">
      <div class="verdict ok" id="verdict">—</div>
      <div class="streak">streak<br><b id="streak">0</b> days</div>
    </div>
  </div>

  <div class="timeline" id="timeline"></div>

  <div class="notes">
    <label for="noteBox">Adjustments / notes for today</label>
    <textarea id="noteBox" placeholder="e.g. moved DSA block 3 earlier, lost 40 min to power cut..."></textarea>
  </div>

  <div class="reset-row">
    <button class="reset-btn" id="resetBtn">Reset today</button>
  </div>

</div>

<script>
const BLOCKS = [
  {id:'wake',  start:240,  end:270,  label:'Wake & Prep',                 tag:'life'},
  {id:'dsa1',  start:270,  end:450,  label:'DSA — Block 1',               tag:'focus'},
  {id:'bfast', start:450,  end:495,  label:'Breakfast',                   tag:'life'},
  {id:'dsa2',  start:495,  end:675,  label:'DSA — Block 2',               tag:'focus'},
  {id:'brk1',  start:675,  end:690,  label:'Short Break',                 tag:'life'},
  {id:'cs',    start:690,  end:750,  label:'CS Fundamentals',             tag:'focus'},
  {id:'lunch', start:750,  end:810,  label:'Lunch',                       tag:'life'},
  {id:'py',    start:810,  end:930,  label:'Python / Project Work',       tag:'focus'},
  {id:'brk2',  start:930,  end:945,  label:'Short Break',                 tag:'life'},
  {id:'dsa3',  start:945,  end:1065, label:'DSA — Block 3 (Revision)',    tag:'focus'},
  {id:'walk',  start:1065, end:1110, label:'Walk / Movement',             tag:'life'},
  {id:'career',start:1110, end:1170, label:'Applications & Networking',   tag:'focus'},
  {id:'dinner',start:1170, end:1215, label:'Dinner',                      tag:'life'},
  {id:'read',  start:1215, end:1290, label:'Reading',                     tag:'focus'},
  {id:'plan',  start:1290, end:1320, label:'Plan Tomorrow',               tag:'life'},
];
const DAY_START = 240, DAY_END = 1320, TOTAL = DAY_END - DAY_START;

function fmt(mins){
  const h24 = Math.floor(mins/60), m = mins%60;
  const ampm = h24 >= 12 ? 'PM' : 'AM';
  let h = h24 % 12; if(h===0) h=12;
  return `${h}:${String(m).padStart(2,'0')} ${ampm}`;
}

function todayKey(){
  const d = new Date();
  return `grind:${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateKeyOffset(offsetDays){
  const d = new Date();
  d.setDate(d.getDate()+offsetDays);
  return `grind:${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

let state = {completed:[], note:''};

async function loadState(){
  try{
    const raw = localStorage.getItem(todayKey());
    if(raw){ state = JSON.parse(raw); }
  }catch(e){ state = {completed:[], note:''}; }
}
async function saveState(){
  try{ localStorage.setItem(todayKey(), JSON.stringify(state)); }
  catch(e){ console.error('save failed', e); }
}

async function computeStreak(){
  let streak = 0;
  for(let i=1;i<=60;i++){
    try{
      const raw = localStorage.getItem(dateKeyOffset(-i));
      if(!raw) break;
      const day = JSON.parse(raw);
      if(day.completed && day.completed.length === BLOCKS.length) streak++;
      else break;
    }catch(e){ break; }
  }
  document.getElementById('streak').textContent = streak;
}

function render(){
  const now = new Date();
  const curMin = now.getHours()*60 + now.getMinutes();

  // clock
  document.getElementById('clock').textContent =
    `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  document.getElementById('clockSecs').textContent =
    String(now.getSeconds()).padStart(2,'0')+' SEC';
  document.getElementById('dateline').textContent =
    now.toLocaleDateString('en-IN',{weekday:'long', day:'numeric', month:'short'}).toUpperCase();

  // timeline
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';
  BLOCKS.forEach(b=>{
    const done = state.completed.includes(b.id);
    const isNow = curMin >= b.start && curMin < b.end;
    const isPast = curMin >= b.end;

    const row = document.createElement('div');
    row.className = 'block' + (isNow?' now':'') + (done?' done':'') + (isPast?' past':'');

    const check = document.createElement('div');
    check.className = 'check';
    check.textContent = done ? '✓' : '';
    check.onclick = async ()=>{
      if(done) state.completed = state.completed.filter(x=>x!==b.id);
      else state.completed.push(b.id);
      await saveState();
      render();
      computeStreak();
    };

    const info = document.createElement('div');
    info.className = 'block-info';
    const time = document.createElement('div');
    time.className = 'block-time';
    time.textContent = `${fmt(b.start)} – ${fmt(b.end)}`;
    const label = document.createElement('div');
    label.className = 'block-label';
    label.textContent = b.label;
    info.appendChild(time); info.appendChild(label);

    const tag = document.createElement('div');
    tag.className = 'tag '+b.tag;
    tag.textContent = b.tag;

    row.appendChild(check);
    row.appendChild(info);
    if(isNow){
      const badge = document.createElement('div');
      badge.className = 'now-badge';
      badge.textContent = 'NOW';
      row.appendChild(badge);
    }
    row.appendChild(tag);

    tl.appendChild(row);
  });

  // progress bars
  const totalDuration = TOTAL;
  let actualMinutes = 0;
  BLOCKS.forEach(b=>{ if(state.completed.includes(b.id)) actualMinutes += (b.end-b.start); });
  const actualPct = Math.min(100, (actualMinutes/totalDuration)*100);

  let expectedPct;
  if(curMin <= DAY_START) expectedPct = 0;
  else if(curMin >= DAY_END) expectedPct = 100;
  else expectedPct = ((curMin-DAY_START)/totalDuration)*100;

  document.getElementById('actualPct').textContent = Math.round(actualPct)+'%';
  document.getElementById('expectedPct').textContent = Math.round(expectedPct)+'%';
  document.getElementById('actualBar').style.width = actualPct+'%';
  document.getElementById('expectedBar').style.left = expectedPct+'%';

  const verdict = document.getElementById('verdict');
  const diff = actualPct - expectedPct;
  const diffMins = Math.round(Math.abs(diff)/100*totalDuration);
  if(curMin < DAY_START){
    verdict.textContent = 'NOT STARTED';
    verdict.className = 'verdict ok';
  } else if(diff >= -3){
    verdict.textContent = diff > 8 ? `AHEAD BY ${diffMins}M` : 'ON TRACK';
    verdict.className = 'verdict ' + (diff>8 ? 'ahead' : 'ok');
  } else {
    verdict.textContent = `BEHIND BY ${diffMins}M`;
    verdict.className = 'verdict behind';
  }

  // notes
  const noteBox = document.getElementById('noteBox');
  if(document.activeElement !== noteBox){
    noteBox.value = state.note || '';
  }
}

document.getElementById('noteBox').addEventListener('input', async (e)=>{
  state.note = e.target.value;
  await saveState();
});

document.getElementById('resetBtn').addEventListener('click', async ()=>{
  state = {completed:[], note:''};
  await saveState();
  render();
  computeStreak();
});

(async function init(){
  await loadState();
  render();
  computeStreak();
  setInterval(render, 1000);
})();
</script>
</body>
</html>
